<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&family=Noto+Sans+TC:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&text=%E2%88%80%C2%AC%E2%86%92%E2%89%A1%E2%88%A8%CE%A3&display=swap" rel="stylesheet">

<style>
/* ============ Shell (theme-aware chrome around the article) ============ */
:root{
  color-scheme: light;
  --s-bg:#F0EDEF; --s-surface:#FFFFFF; --s-text:#1B1B1D; --s-muted:#44474C; --s-line:#C5C6CD;
  --s-strong:#0A1626; --s-on-strong:#FFFFFF; --s-gold:#A88B52; --s-mist:rgba(168,139,82,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(16px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --s-bg:#060E19; --s-surface:#101C2C; --s-text:#E8E9EC; --s-muted:#A9AEB8; --s-line:#3C4759;
    --s-strong:#E8E9EC; --s-on-strong:#0A1626; --s-gold:#A88B52; --s-mist:rgba(168,139,82,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --s-bg:#060E19; --s-surface:#101C2C; --s-text:#E8E9EC; --s-muted:#A9AEB8; --s-line:#3C4759;
  --s-strong:#E8E9EC; --s-on-strong:#0A1626; --s-gold:#A88B52; --s-mist:rgba(168,139,82,.16);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--s-bg);color:var(--s-text);font-family:Manrope,"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s-gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.progress{position:fixed;left:0;right:0;top:0;height:calc(2px + env(safe-area-inset-top,0px));z-index:15;pointer-events:none;background:linear-gradient(var(--s-surface),var(--s-surface)) top/100% env(safe-area-inset-top,0px) no-repeat}
.progress i{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--s-gold);transform-origin:left;transform:scaleX(0);will-change:transform}

.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:16;width:48px;height:48px;border:1px solid var(--s-line);border-radius:2px;background:var(--s-surface);color:var(--s-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 20px 60px -15px rgba(10,22,38,.25);transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s}
.fab:hover{border-color:var(--s-muted)}
.fab svg{width:20px;height:20px}
body.sheet-open .fab{opacity:0;pointer-events:none}

.scrim{position:fixed;inset:0;background:rgba(10,22,38,.45);z-index:18;opacity:0;pointer-events:none;transition:opacity .4s cubic-bezier(.16,1,.3,1)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:19;background:var(--s-surface);border-left:1px solid var(--s-line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .5s cubic-bezier(.16,1,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--s-line)}
.sheet-head b{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.1em;font-size:14px;color:var(--s-strong)}
.sheet-head b svg{width:26px;height:26px;display:block}
.sheet-body{overflow:auto;flex:1;padding:4px 0 24px}
.grp{padding:16px 20px;border-bottom:1px solid var(--s-line)}
.grp h3{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--s-muted)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:32px 1fr;gap:4px;padding:9px 0;color:var(--s-text);text-decoration:none;font-size:14px;line-height:1.45;border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
.toc a .n{color:var(--s-muted);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.toc a.on{border-left-color:var(--s-gold);background:var(--s-mist)}
.seg{display:inline-flex;border:1px solid var(--s-line);border-radius:2px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font-size:13px;color:var(--s-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--s-strong);color:var(--s-on-strong)}
.act{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--s-line);padding:12px 0;font-size:14px;cursor:pointer;color:var(--s-text)}
.act:first-of-type{border-top:0}
.act small{color:var(--s-muted);font-size:12px}
.act[disabled]{opacity:.45;cursor:default}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--s-muted);padding-top:12px}
.chk input{accent-color:var(--s-gold);width:16px;height:16px}
.lib{list-style:none;margin:0;padding:0}
.lib button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--s-line);padding:10px 0;cursor:pointer;font-size:14px}
.lib button small{display:block;color:var(--s-muted);font-size:12px;margin-top:2px}
.lib button[aria-current="true"]{color:var(--s-gold)}
.muted{font-size:13px;color:var(--s-muted);line-height:1.6;margin:0}
.btn{border:1px solid var(--s-line);background:var(--s-surface);color:var(--s-strong);padding:8px 14px;border-radius:2px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--s-strong);color:var(--s-on-strong);border-color:var(--s-strong)}
.btn[disabled]{opacity:.45}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,22,38,.45);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal.on{display:flex}
.mbox{background:var(--s-surface);border-radius:4px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mbox header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--s-line)}
.mbox header b{font-size:15px;font-weight:600;color:var(--s-strong)}
.mbox .mbody{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.mbox textarea,.mbox pre{width:100%;min-height:46vh;border:1px solid var(--s-line);border-radius:2px;background:var(--s-bg);color:var(--s-text);padding:12px;font-size:12px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;margin:0;white-space:pre-wrap;word-break:break-word}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--s-line)}
.mbox img{width:100%;border:1px solid var(--s-line)}
.err{color:#BA1A1A;font-size:13px;min-height:1em;margin:0}

.termsheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:17;width:min(520px,calc(100% - 32px));background:var(--s-surface);border:1px solid var(--s-line);border-radius:4px;padding:18px 20px;box-shadow:0 20px 60px -15px rgba(10,22,38,.3);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.termsheet.on{transform:translate(-50%,0)}
.termsheet b{display:block;font-size:16px;font-weight:600;color:var(--s-strong);margin-bottom:6px}
.termsheet p{margin:0 0 12px;font-size:14px;line-height:1.65;color:var(--s-text)}
.termsheet .r{display:flex;gap:8px}
.editor{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:21;background:var(--s-surface);border-left:1px solid var(--s-line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .5s cubic-bezier(.16,1,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.editor.on{transform:none}
.editor header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--s-line)}
.editor header b{font-size:15px;font-weight:600;color:var(--s-strong)}
.editor .eh-r{display:flex;gap:8px}
.editor .ebody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.editor textarea{flex:1;min-height:0;width:100%;border:1px solid var(--s-line);border-radius:2px;background:var(--s-bg);color:var(--s-text);padding:12px;font-size:12.5px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:none;tab-size:2}
.editor .row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--s-line)}
.editor .err{white-space:pre-line;max-height:7.5em;overflow:auto}
.editor .chk{padding-top:0}
body.editing.ed-open .fab{opacity:0;pointer-events:none}
@media (min-width: 1100px){
  body.editing.ed-open .stage{margin-right:560px}
  body.editing.ed-open #article{--u:min(0.8px, calc((100vw - 600px) / 750))}
  #edPreview{display:none}
}
/* Preview width: Auto follows the screen; Phone and Web simulate H5 and desktop reading. Exports always use the fixed 750 px layout. */
#article[data-view="phone"]{--u:calc(390px / 750) !important;box-shadow:0 0 0 1px var(--s-line),0 20px 60px -15px rgba(10,22,38,.25)}
#article[data-view="web"]{--u:0.8px !important}
.stage:has(#article[data-view]){overflow-x:auto;padding-top:24px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:40;background:var(--s-strong);color:var(--s-on-strong);padding:10px 16px;border-radius:4px;font-size:13px;transition:transform .4s cubic-bezier(.16,1,.3,1);max-width:90vw}
.toast.on{transform:translate(-50%,0)}

.stage{padding:0 0 96px}
@media (min-width: 760px){.stage{padding:40px 16px 120px}}

/* ============ Article (content rendered with theme tokens; fluid unit --u = 1/750 of the column) ============ */
#article{
  --u: min(0.8px, calc(100vw / 750));
  --fs-cap:calc(20*var(--u)); --fs-small:calc(21*var(--u)); --fs-label:calc(23*var(--u)); --fs-body:calc(28*var(--u));
  --fs-h3:calc(26*var(--u)); --fs-lead:calc(36*var(--u)); --fs-quote:calc(44*var(--u)); --fs-h2:calc(56*var(--u));
  --fs-stat:calc(72*var(--u)); --fs-h1:calc(116*var(--u));
  --px:calc(56*var(--u)); --rule:max(1px, calc(2*var(--u)));
  width:calc(750*var(--u));margin:0 auto;background:var(--c-ground);color:var(--c-ink);
  font-family:var(--font-sans),"Noto Sans TC",sans-serif;font-size:var(--fs-body);line-height:1.7;
}
#article:lang(zh-Hant-HK){font-family:var(--font-zh),var(--font-sans),sans-serif;line-height:1.85}
#article h1,#article h2,#article .sub,#article .lead,#article .quote p,#article .prin .h,#article .end-line{text-wrap:balance}
#article p.t,#article .prin .d,#article .fn,#article .note,#article .stat .l,#article .gl-d{text-wrap:pretty}
.sec{position:relative;padding:calc(80*var(--u)) var(--px) calc(72*var(--u));content-visibility:auto;contain-intrinsic-size:auto calc(1400*var(--u))}
.sec-cover{content-visibility:visible}
.exporting .sec{content-visibility:visible}
.logo{display:block;height:auto}
.cover-logo{width:calc(230*var(--u));margin:0 0 calc(56*var(--u))}
.foot-logo{width:calc(112*var(--u))}
.ring-wrap{position:relative;width:calc(300*var(--u));margin:0 auto calc(48*var(--u))}
.ring-wrap svg{width:100%;height:auto;display:block}
.ring-wrap .logo{position:absolute;left:50%;top:50%;width:19%;transform:translate(-50%,-50%)}
.sec + .sec{border-top:var(--rule) solid var(--c-hair)}
.sec.dark{background:var(--c-panel);color:var(--c-panel-ink);border-top-color:var(--c-panel)}
.sec.dark + .sec{border-top-color:var(--c-ground)}
.sec-cover{padding-top:calc(96*var(--u))}
.eyebrow{font-size:var(--fs-cap);font-weight:600;text-transform:uppercase;letter-spacing:.3em;color:var(--c-ink2);margin:0 0 calc(24*var(--u));line-height:1.4}
:lang(zh-Hant-HK) .eyebrow{letter-spacing:0;font-size:calc(22*var(--u))}
.accent{width:calc(64*var(--u));height:var(--rule);background:var(--c-deep);margin:0 0 calc(36*var(--u))}
#article h1{font-weight:300;font-size:var(--fs-h1);line-height:.95;letter-spacing:-.03em;color:var(--c-deep);margin:0 0 calc(36*var(--u))}
#article:lang(zh-Hant-HK) h1{font-size:calc(100*var(--u));letter-spacing:0;line-height:1.15}
.sub{font-size:calc(34*var(--u));line-height:1.45;color:var(--c-ink2);font-weight:300;margin:0 0 calc(8*var(--u))}
:lang(zh-Hant-HK) .sub{font-size:calc(32*var(--u));line-height:1.65}
.byline{font-size:var(--fs-cap);color:var(--c-ink2);margin:0}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--c-grid) var(--rule),transparent var(--rule)),linear-gradient(90deg,var(--c-grid) var(--rule),transparent var(--rule));background-size:calc(75*var(--u)) calc(75*var(--u));pointer-events:none}
.cover-body{position:relative}
.ring{position:relative;width:calc(560*var(--u));height:calc(560*var(--u));margin:calc(48*var(--u)) auto calc(16*var(--u))}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .node{position:absolute;transform:translate(-50%,-50%);font-size:calc(24*var(--u));font-weight:600;color:var(--c-deep);white-space:nowrap;background:var(--c-ground);padding:calc(2*var(--u)) calc(8*var(--u))}
:lang(zh-Hant-HK) .ring .node{font-size:calc(26*var(--u))}
.ring .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--c-ground);font-size:calc(21*var(--u));font-weight:600;letter-spacing:.04em;text-align:center;width:calc(120*var(--u))}
:lang(zh-Hant-HK) .ring .center{letter-spacing:0;font-size:calc(24*var(--u))}
.caption{font-size:calc(22*var(--u));line-height:1.5;color:var(--c-ink2);text-align:center;margin:0 0 calc(40*var(--u));text-wrap:balance}
.lead{font-size:var(--fs-lead);line-height:1.55;font-weight:300;color:var(--c-deep);margin:0 0 calc(56*var(--u))}
:lang(zh-Hant-HK) .lead{font-size:calc(34*var(--u));line-height:1.75}
.num{font-size:var(--fs-cap);font-weight:600;letter-spacing:.2em;color:var(--c-ink2);margin:0 0 calc(16*var(--u))}
#article h2{font-weight:300;font-size:var(--fs-h2);line-height:1.12;letter-spacing:-.025em;color:var(--c-deep);margin:0 0 calc(36*var(--u))}
#article:lang(zh-Hant-HK) h2{font-size:calc(50*var(--u));letter-spacing:0;line-height:1.3}
p.t{margin:0 0 calc(32*var(--u))}
.term{border-bottom:var(--rule) dotted var(--c-gold);cursor:help}
.term:hover{background:var(--c-mist)}
.exporting .term{border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--rule);background:var(--c-hair);border:var(--rule) solid var(--c-hair);margin:calc(40*var(--u)) 0 calc(8*var(--u))}
.stat{background:var(--c-ground);padding:calc(32*var(--u)) calc(28*var(--u))}
.stat .v{font-size:var(--fs-stat);font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--c-deep);font-variant-numeric:tabular-nums;margin-bottom:calc(16*var(--u))}
:lang(zh-Hant-HK) .stat .v{font-size:calc(64*var(--u));letter-spacing:-.01em}
.stat.key .v{color:var(--c-gold-text)}
.stat .l{font-size:var(--fs-small);line-height:1.5;color:var(--c-ink2)}
.prin{list-style:none;margin:calc(8*var(--u)) 0 0;padding:0}
.prin li{display:grid;grid-template-columns:calc(84*var(--u)) 1fr;gap:calc(4*var(--u));padding:calc(30*var(--u)) 0;border-top:var(--rule) solid var(--c-hair)}
.prin li:last-child{border-bottom:var(--rule) solid var(--c-hair)}
.prin .n{font-size:calc(60*var(--u));font-weight:200;line-height:1;color:var(--c-deep);opacity:.35;font-variant-numeric:tabular-nums}
.prin .h{font-size:calc(30*var(--u));font-weight:600;color:var(--c-deep);margin:0 0 calc(8*var(--u));line-height:1.35}
.prin .d{font-size:calc(25*var(--u));color:var(--c-ink2);margin:0;line-height:1.6}
.fig{border:var(--rule) solid var(--c-hair);padding:calc(32*var(--u));margin:calc(40*var(--u)) 0}
.fig .ft{font-size:var(--fs-h3);font-weight:600;color:var(--c-deep);margin:0 0 calc(6*var(--u));line-height:1.35}
.fig .fs{font-size:var(--fs-cap);color:var(--c-ink2);margin:0 0 calc(28*var(--u));line-height:1.5}
.fig .fn{font-size:var(--fs-cap);color:var(--c-ink2);margin:calc(24*var(--u)) 0 0;line-height:1.6}
.sbar{display:flex;height:calc(64*var(--u));margin-bottom:calc(24*var(--u))}
.legend .r{display:grid;grid-template-columns:calc(20*var(--u)) 1fr auto;gap:calc(16*var(--u));align-items:center;padding:calc(14*var(--u)) 0;border-top:var(--rule) solid var(--c-hair);font-size:var(--fs-label);line-height:1.4}
.legend .sw{width:calc(20*var(--u));height:calc(20*var(--u))}
.legend .val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--c-deep)}
.ranges .r{padding:calc(12*var(--u)) 0}
.ranges .lab{font-size:calc(22*var(--u));line-height:1.35;margin-bottom:calc(8*var(--u))}
.ranges .track{position:relative;height:calc(36*var(--u))}
.ranges .gridl{position:absolute;top:calc(-6*var(--u));bottom:calc(-6*var(--u));width:var(--rule);background:var(--c-hair)}
.ranges .bar{position:absolute;top:calc(10*var(--u));height:calc(16*var(--u))}
.ranges .dot{position:absolute;top:calc(8*var(--u));width:calc(20*var(--u));height:calc(20*var(--u));border-radius:50%;margin-left:calc(-10*var(--u))}
.ranges .vl{position:absolute;top:0;font-size:var(--fs-small);font-weight:600;color:var(--c-deep);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:calc(36*var(--u))}
.ranges .ticks{position:relative;height:calc(28*var(--u));font-size:calc(18*var(--u));color:var(--c-ink2);margin-top:calc(12*var(--u))}
.ranges .ticks span{position:absolute;transform:translateX(-50%)}
.ranges .ticks span:first-child{transform:none}
.ranges .ticks span:last-child{transform:translateX(-100%)}
.layers .band{border:var(--rule) solid var(--c-hair)}
.layers .conn{width:var(--rule);height:calc(24*var(--u));background:var(--c-outline);margin:0 auto}
.layers .bt{padding:calc(16*var(--u)) calc(20*var(--u));font-size:var(--fs-label);font-weight:600;color:var(--c-deep);border-bottom:var(--rule) solid var(--c-hair)}
.layers .items{display:flex;flex-wrap:wrap;gap:calc(12*var(--u));padding:calc(18*var(--u)) calc(20*var(--u))}
.layers .chip{border:var(--rule) solid var(--c-hair);border-radius:2px;padding:calc(8*var(--u)) calc(14*var(--u));font-size:var(--fs-small);line-height:1.35}
.layers .band.dark{background:var(--c-panel);border-color:var(--c-panel)}
.layers .band.dark .bt{color:var(--c-panel-ink);border-bottom-color:var(--c-panel-line)}
.layers .band.dark .chip{color:var(--c-panel-ink);border-color:var(--c-gold)}
.steps{margin:calc(36*var(--u)) 0}
.steps .s{display:grid;grid-template-columns:calc(68*var(--u)) 1fr;gap:calc(8*var(--u));position:relative;padding:0 0 calc(30*var(--u))}
.steps .s::before{content:"";position:absolute;left:calc(19*var(--u));top:calc(44*var(--u));bottom:calc(4*var(--u));width:var(--rule);background:var(--c-hair)}

<script type="module">

        const label = m[2] ?? (term ? pick(term.term, locale) : m[1]);

        out.push({ kind: "text", text: source.slice(last) });

/** Every term id referenced in the article, for validation and glossary pruning. */

// packages/core/src/validate.js
function validate(input) {

    const a = input;
    if (!a || typeof a !== "object")
        return { ok: false, issues: [{ path: "", message: "Not an object." }] };
    if (a.schema !== SCHEMA)
        issues.push({ path: "schema", message: `Must be "${SCHEMA}".` });
    if (typeof a.id !== "string" || !/^[a-z0-9-]{3,80}$/.test(a.id))
        issues.push({ path: "id", message: "3–80 lowercase letters, digits or hyphens." });
    if (!Array.isArray(a.sections) || a.sections.length === 0)
        issues.push({ path: "sections", message: "Must be a non-empty array." });
    const seen = new Set();
    a.sections?.forEach((s, i) => {
        if (!s.id)
            issues.push({ path: `sections[${i}].id`, message: "Required." });
        else if (seen.has(s.id))
            issues.push({ path: `sections[${i}].id`, message: `Duplicate id "${s.id}".` });
        else
            seen.add(s.id);
        if (!Array.isArray(s.blocks))
            issues.push({ path: `sections[${i}].blocks`, message: "Must be an array." });

// packages/core/src/markdown.js
/**
 * Markdown ⇄ tableai.article/v2.

 * One Markdown file per locale (`<id>.en.md`, `<id>.zh.md`) with the same structure.
 * `fromMarkdown` parses each file into a single-language tree and merges them into
 * `{ en, zh }` text fields; `toMarkdown` writes one locale back out. Round-trips are lossless
 * for every block type the reader renders.
 *
 * Dialect
 *   ---                                   front matter: schema, id, slug, status, version, date,
 *   key: value                            locale, locales, brand (name | site | contact), title, summary
 *   ---
 *   ::: terms                             glossary definitions: - id | Term | Definition
 *   ## 01 Section title {#id .kind .dark .notoc label="Contents label"}
 *   Plain paragraph.                      → p      (inline terms: [[id]] or [[id|label]])
 *   > Quoted line.                        → quote
 *   ::: lead | note … :::                 → text blocks

 */

const cell = (s) => s.replace(/\|/g, "\\|");

const LIST_SEP = " ; ";

    if (a.status)
        fm.push(`status: ${a.status}`);
    if (a.version != null)
        fm.push(`version: ${a.version}`);
    if (a.date)
        fm.push(`date: ${a.date}`);
    fm.push(`locale: ${locale}`);
    if (a.locales?.length)

        case "timeline": return directive("timeline", b.items.map((i) => `- ${cell(P(i.date))} | ${cell(P(i.text))}`));

function parseHeading(line, index, issues, n) {

xt Protocol）：AI 模型發現工具、調用工具及讀取數據的開放標準。"}},"api":{"term":{"en":"API","zh":"API"},"def":{"en":"Application programming interface: the published contract through which software requests data or actions.","zh":"應用程式介面：軟件據以請求數據或操作的公開契約。"}},"ota":{"term":{"en":"OTA","zh":"在線旅遊平台（OTA）"},"def":{"en":"Online travel agency: a platform that sells hotel and travel bookings in exchange for commission.","zh":"在線旅遊代理：以收取佣金方式銷售酒店及旅遊預訂的平台。"}},"stablecoin":{"term":{"en":"Stablecoin","zh":"穩定幣"},"def":{"en":"A digital token redeemable one-for-one in a fiat currency and issued under licence.","zh":"可按一比一兌換法定貨幣、並持牌發行的數碼代幣。"}},"opc":{"term":{"en":"OPC Global","zh":"歐匹賽全球聯盟（OPC Global）"},"def":{"en":"The Hong Kong alliance registered as 欧匹赛全球联盟. OPC stands not for a company form but for intellectual equality and a renewal of civilisation’s general-purpose technologies.","zh":"於香港註冊的「歐匹賽全球聯盟」。OPC 代表的不是一種公司形態，而是智力平權，以及人類文明通用技術的革新。"}}},"sections":[{"id":"cover","blocks":[{"type":"cover","eyebrow":{"en":"Manifesto 01","zh":"宣言 01"},"subtitle":{"en":"Those who create value should own a share of it, for as long as it keeps flowing.","zh":"創造價值的人，應當擁有價值的一部分；只要價值持續流動，這份所有權便持續存在。"},"byline":{"en":"TABLE AI, Hong Kong, 8 November 2026","zh":"TABLE AI　香港　2026年11月8日"},"ring":{"center":{"en":"Router","zh":"路由器"},"nodes":[{"en":"Customer","zh":"顧客"},{"en":"Merchant","zh":"商戶"},{"en":"Expert","zh":"專家"},{"en":"Facilitator","zh":"協作者"},{"en":"Introducer","zh":"引薦人"}],"caption":{"en":"Every participant holds an agent; every transaction passes through one router.","zh":"每位參與者擁有一個智能體；每筆交易經過同一個路由器。"}}}],"kind":"cover","toc":false},{"id":"mission","blocks":[{"type":"lead","text":{"en":"The internet accelerated information. The mobile internet reorganised time. The AI era changes something more fundamental: who has access to capability.","zh":"互聯網提速了資訊，移動互聯網重排了時間。AI 時代改變的，是更根本的東西：誰能擁有能力。"}},{"type":"timeline","items":[{"date":{"en":"Internet","zh":"互聯網"},"text":{"en":"Information moves faster","zh":"資訊提速"}},{"date":{"en":"Mobile internet","zh":"移動互聯網"},"text":{"en":"Time is reorganised","zh":"時間重排"}},{"date":{"en":"AI era","zh":"AI 時代"},"text":{"en":"Capability is shared: the User Centered Era","zh":"能力平權：用戶中心時代"}}]},{"type":"p","text":{"en":"The AI era is an era of intellectual equality: fair and just, and a spring for the kind-hearted and for seasoned product builders. This is the User Centered Era. It sets out to raise not only the ceiling of human capability but its average and its floor, and to make value, rather than price, the true centre of commerce.","zh":"AI 時代是智力平權的時代：公平公正，是老好人和老產品人的春天。這就是「用戶中心時代」。它要提高的不只是人類能力的上限，更是平均水準與下限；它要讓價值超越價格，成為商業真正的核心。"}},{"type":"p","text":{"en":"AI alone does not guarantee equality: whoever holds the tools tends to capture the gains. What turns AI toward equality is a rule. Every contribution is recorded, and its returns belong to those who created it.","zh":"然而 AI 本身並不保證平權：工具在誰手中，收益便流向誰。真正讓 AI 走向平權的，是一條規則：每一項貢獻都被紀錄，收益歸屬於創造價值的人。"}},{"type":"quote","text":{"en":"AI equalises capability. UCE equalises returns.","zh":"AI 讓能力平權，UCE 讓收益平權。"}}],"num":"01","title":{"en":"Every era has its mission","zh":"每個時代都有它的使命"}},{"id":"value","blocks":[{"type":"lead","text":{"en":"For two decades, platforms have organised the hospitality economy. Customers fund it, merchants carry its risk, and intermediaries keep a durable share of every transaction. TABLE AI proposes a different settlement: a User Centered Era, in which every verified contribution, whether a meal, a booking, an introduction or an hour of expert work, earns its owner a recorded and lasting share of the value it creates.","zh":"過去二十年，平台組織了整個餐飲與住宿經濟。顧客為它提供資金，商戶承擔它的風險，而中介在每一筆交易中保留持久的份額。TABLE AI 提出另一種分配方式——「用戶中心時代」：每一項經驗證的貢獻，無論是一頓飯、一次預訂、一次引薦，還是一小時的專家工作，都為貢獻者帶來有紀錄、可持續的價值份額。"}},{"type":"p","text":{"en":"China’s catering revenue reached ¥5.80 trillion in 2025. In accommodation, independent hotels pay [[ota|online travel platforms]] 15 to 30 per cent of each booking, and chains 8 to 15 per cent. AI [[agent|agents]] have not lowered this cost: in August 2026 a leading AI assistant began charging hotels 12 per cent on the orders it refers.","zh":"2025年，中國餐飲收入達人民幣5.80萬億元。在住宿領域，單體酒店向[[ota|在線旅遊平台]]支付每筆訂單15%至30%的佣金，連鎖酒店則為8%至15%。AI [[agent|智能體]]並未降低這項成本：2026年8月，一款領先的 AI 助手開始就其轉介的酒店訂單向商戶收取12%的費用。"}},{"type":"p","text":{"en":"Loyalty, meanwhile, has become one of the most valuable assets in commerce, for its owners. In 2020 United Airlines valued its MileagePlus programme at $21.9 billion and borrowed against it. The miles came from members’ spending; the asset belonged to the airline.","zh":"與此同時，忠誠計劃已成為商業中最有價值的資產之一——但只屬於其擁有者。2020年，聯合航空將其 MileagePlus 計劃估值為219億美元，並以此抵押借款。里數源自會員的消費，資產卻屬於航空公司。"}},{"type":"stats","items":[{"value":{"en":"¥5.80T","zh":"5.80萬億"},"label":{"en":"China catering revenue, 2025 (RMB)","zh":"中國餐飲收入，2025年（人民幣）"}},{"value":{"en":"15–30%","zh":"15–30%"},"label":{"en":"Commission paid by independent hotels to online travel platforms","zh":"單體酒店支付予在線旅遊平台的佣金"}},{"value":{"en":"12%","zh":"12%"},"label":{"en":"Fee on AI-assistant hotel referrals, from August 2026","zh":"AI 助手轉介酒店訂單收費，2026年8月起"},"key":true},{"value":{"en":"$21.9B","zh":"219億美元"},"label":{"en":"Value placed on one airline loyalty programme, 2020","zh":"一項航空忠誠計劃的估值，2020年"}}]}],"num":"02","title":{"en":"Value created, value kept","zh":"創造的價值，保留的價值"}},{"id":"principles","blocks":[{"type":"principles","items":[{"title":{"en":"Spend is capital.","zh":"消費即資本。"},"text":{"en":"Every verified purchase earns the customer a lasting, cash-backed claim on the network it helps fund.","zh":"每一筆經驗證的消費，都為顧客帶來一份對其所支持網絡的持久、有現金支持的權益。"}},{"title":{"en":"Contribution is recorded, not claimed.","zh":"貢獻以紀錄為準，而非以聲稱為準。"},"text":{"en":"Every hour, introduction, result and payment is a counter-signed fact in the [[fact-ledger|fact ledger]]. No one is paid on assertion.","zh":"每一小時、每一次引薦、每一項成果與每一筆付款，均為[[fact-ledger|事實帳本]]中經雙方簽署的事實；任何報酬都不基於單方面的說法。"}},{"title":{"en":"Every participant has an agent that serves its owner.","zh":"每位參與者都擁有為其服務的智能體。"},"text":{"en":"Customers, merchants, experts and facilitators each hold an [[agent]] loyal to them, never to the platform. Ranking is never for sale.","zh":"顧客、商戶、專家與協作者各自擁有只忠於自己、而非忠於平台的[[agent|智能體]]；排名永不出售。"}},{"title":{"en":"Transactions settle at the speed of the network.","zh":"交易以網絡的速度結算。"},"text":{"en":"One [[router]] clears and divides every payment instantly; money moves in bulk, at low cost, behind the scenes.","zh":"一個[[router|路由器]]即時清算並分配每一筆付款；資金在後台以批量、低成本的方式流轉。"}},{"title":{"en":"Help comes first.","zh":"幫助優先。"},"text":{"en":"Those who need education and support receive it from the first day; those who provide it are rewarded in ownership when cash is scarce.","zh":"需要教育與支援的人，從第一天起即可獲得；提供幫助的人，在現金不足時以所有權獲得回報。"}},{"title":{"en":"Ownership is earned, never sold.","zh":"所有權只能賺取，永不出售。"},"text":{"en":"Shares arise only from verified consumption, delivery or teaching, never from deposits or recruitment.","zh":"份額只來自經驗證的消費、交付或教學，絕不來自存款或招募。"}},{"title":{"en":"Local law, global rights.","zh":"本地合規，全球權益。"},"text":{"en":"Each jurisdiction receives the legal form it permits; the rights recorded on the ledger are the same everywhere.","zh":"每個司法管轄區採用其允許的法律形式；帳本上紀錄的權益在各地一致。"}}]}],"num":"03","title":{"en":"Seven principles","zh":"七項原則"}},{"id":"commission","blocks":[{"type":"p","text":{"en":"Under the proposed alliance model, a merchant pays once at market rates to acquire a customer, and markedly less to keep them. The commission is then divided among the people who caused the transaction, including the [[introducer|original introducer]].","zh":"在擬議的聯盟模式下，商戶以市場價格支付一次費用以獲取顧客，其後留住顧客的成本明顯較低。佣金隨後分配給促成這筆交易的人，包括[[introducer|原始引薦人]]。"}},{"type":"stacked","title":{"en":"Division of a 12% first-booking commission","zh":"首次預訂12%佣金的分配"},"subtitle":{"en":"Percentage points of the booking value, illustrative","zh":"佔訂單金額的百分點（示意）"},"note":{"en":"Repeat direct bookings carry 7.5%; the booking-agent share is waived.","zh":"回頭客直接預訂的費率為7.5%，免除預訂智能體份額。"},"segments":[{"label":{"en":"Booking agent or creator","zh":"預訂智能體或創作者"},"value":4,"tone":"deep"},{"label":{"en":"Customer rebate","zh":"顧客回饋"},"value":3,"tone":"gold"},{"label":{"en":"Shared pool for lasting customer shares","zh":"共享池（顧客持久份額）"},"value":2.4,"tone":"slate"},{"label":{"en":"Original introducer","zh":"原始引薦人"},"value":2,"tone":"steel"},{"label":{"en":"Platform","zh":"平台"},"value":0.6,"tone":"light"}]},{"type":"ranges","title":{"en":"Commission on a hotel booking, by channel","zh":"各渠道酒店預訂佣金"},"subtitle":{"en":"Per cent of booking value","zh":"佔訂單金額百分比"},"note":{"en":"UCE rates are proposed and subject to pilot. In the UCE model, about half of every commission returns to customers and introducers.","zh":"UCE 費率為擬議數字，有待試點驗證。在 UCE 模式下，每筆佣金約一半回到顧客與引薦人手中。"},"max":30,"ticks":[0,10,20,30],"rows":[{"label":{"en":"Independent hotel via OTA","zh":"單體酒店（在線旅遊平台）"},"low":15,"high":30},{"label":{"en":"Chain hotel via OTA","zh":"連鎖酒店（在線旅遊平台）"},"low":8,"high":15},{"label":{"en":"AI assistant referral","zh":"AI 助手轉介"},"low":12,"high":12},{"label":{"en":"Short-video platform","zh":"短視頻平台"},"low":8,"high":8},{"label":{"en":"UCE alliance, first booking","zh":"UCE 聯盟，首次預訂"},"low":12,"high":12,"tone":"deep"},{"label":{"en":"UCE alliance, repeat booking","zh":"UCE 聯盟，回頭客預訂"},"low":7.5,"high":7.5,"tone":"gold"}]},{"type":"p","text":{"en":"The shared pool funds a perpetual, non-transferable customer share, the [[everstake]], paid only from transaction flow and never from new money.","zh":"共享池為顧客提供永久、不可轉讓的份額——[[everstake|恆久權益]]——其資金只來自交易流量，絕不來自新資金。"}}],"num":"04","title":{"en":"Where a booking’s commission goes","zh":"一筆預訂佣金的去向"}},{"id":"stack","blocks":[{"type":"p","text":{"en":"Two components turn the model into infrastructure. Every participant receives an [[agent]], and every transaction passes through one [[router]] that matches, clears and divides it.","zh":"兩個組件令此模式成為基礎設施：每位參與者都擁有一個[[agent|智能體]]；每筆交易都經過同一個[[router|路由器]]，完成配對、清算與分配。"}},{"type":"layers","rows":[{"title":{"en":"Agents","zh":"智能體"},"items":[{"en":"Customer","zh":"顧客"},{"en":"Merchant","zh":"商戶"},{"en":"Expert","zh":"專家"},{"en":"Facilitator","zh":"協作者"},{"en":"Integrity","zh":"誠信"}]},{"title":{"en":"UCE Router","zh":"UCE 路由器"},"items":[{"en":"Demand routing","zh":"需求路由"},{"en":"Payment routing","zh":"支付路由"},{"en":"Value routing","zh":"價值路由"}],"dark":true},{"title":{"en":"Fact ledger","zh":"事實帳本"},"items":[{"en":"Commitment","zh":"承諾"},{"en":"Delivery","zh":"交付"},{"en":"Verification","zh":"驗證"},{"en":"Decision","zh":"決策"},{"en":"Payment","zh":"付款"}]},{"title":{"en":"Pools","zh":"資金池"},"items":[{"en":"Mainland: RMB credits","zh":"內地：人民幣積分"},{"en":"Hong Kong and global","zh":"香港及全球"}]}]},{"type":"p","text":{"en":"Agents connect through open protocols such as [[mcp|MCP]] and published [[api|APIs]], and negotiate [[a2a|agent to agent]]; outside agents can join as booking contributors.","zh":"智能體透過 [[mcp|MCP]] 等開放協議及公開的 [[api|API]] 接入，並以[[a2a|智能體對智能體]]的方式直接協商；外部智能體亦可作為預訂貢獻者加入。"}},{"type":"p","text":{"en":"On each transaction the router matches a customer’s intent to merchants by fit, price and reliability; selects the lowest-cost compliant payment rail; and applies the division instantly on the [[fact-ledger|fact ledger]]. Settlement between institutions runs once a day, in bulk, and later in licensed [[stablecoin|stablecoins]] for the Hong Kong and global pools. The design target is a routing decision in under 100 milliseconds.","zh":"路由器在每筆交易中執行三項任務：按匹配度、價格與信譽，將顧客意圖配對至商戶；選擇成本最低且合規的支付通道；並在[[fact-ledger|事實帳本]]上即時完成分配。機構之間的結算每日批量進行一次，香港及全球資金池其後可採用持牌[[stablecoin|穩定幣]]。設計目標為每項路由決策少於100毫秒。"}}],"num":"05","title":{"en":"An agent for every participant, a router for every transaction","zh":"每位參與者一個智能體，每筆交易一個路由器"}},{"id":"help","blocks":[{"type":"p","text":{"en":"The first phase is not a consumer product. It is an expert and agent help network: experts and AI agents solve real operating problems for owners and learners, and every hour and result is written to the ledger. When a seeker cannot pay, an expert may take the case for a share rather than a fee. When a seeker implements the plan and reports results, the seeker earns a share too, because proof is the network’s most valuable asset.","zh":"第一階段並非消費者產品，而是一個專家與智能體協作的幫助網絡：專家與 AI 智能體為經營者與學習者解決實際經營問題，每一小時、每一項成果都寫入帳本。當求助者無力支付時，專家可以份額代替費用承接個案。當求助者落實方案並回報成果時，求助者同樣獲得份額，因為證據是網絡最有價值的資產。"}},{"type":"steps","items":[{"en":"Problem brought by an owner or learner","zh":"經營者或學習者提出問題"},{"en":"Plan agreed with an expert","zh":"與專家確定方案"},{"en":"Agent-first execution, expert on exceptions","zh":"智能體優先執行，專家處理例外"},{"en":"Result verified and written to the ledger","zh":"成果經驗證並寫入帳本"},{"en":"Settlement to every contributor","zh":"向每一位貢獻者結算"}]},{"type":"p","text":{"en":"The approach extends the method TABLE AI’s Expert-AI Studio has proven in restaurants through 侍天 Tiansight, delivered with the OPC Global expert network.","zh":"這一方法延伸自 TABLE AI 專家 AI 工作室經侍天 Tiansight 在餐飲業驗證的方法，並由 OPC Global 專家網絡共同交付。"}}],"num":"06","title":{"en":"Help comes first","zh":"幫助優先"}},{"id":"opc","blocks":[{"type":"p","text":{"en":"OPC should not be read as “one-person company”. Its essence has little to do with company form; it concerns intellectual equality, and a renewal of the general-purpose technologies of human civilisation.","zh":"OPC 不應被理解為「一人公司」。它的本質與公司形態無關，而關乎智力平權，以及人類文明通用技術的一次革新。"}},{"type":"p","text":{"en":"When [[opc|OPC Global]] was registered in Hong Kong, its first proposed name, One Person Company Global Alliance, was rejected: an organisation cannot be both a company and an alliance. It was renamed 欧匹赛全球联盟. In hindsight, the refusal helped.","zh":"在香港註冊 [[opc|OPC Global]] 時，最初的名稱「一人公司全球聯盟」被駁回：一個組織不能既是公司，又是聯盟。於是改名為「歐匹賽全球聯盟」。回頭看，這是好事。"}},{"type":"stats","items":[{"value":{"en":"IP","zh":"IP"},"label":{"en":"Once meant only intellectual property; now the strongest symbol of monetisation","zh":"最初只是「知識產權」，如今成為最強的變現符號"}},{"value":{"en":"OPC","zh":"OPC"},"label":{"en":"Once read as one-person company; now a label for intellectual equality","zh":"曾被讀作「一人公司」，將成為智力平權的新標籤"},"key":true}]},{"type":"p","text":{"en":"OPC will travel the same way, from a literal abbreviation to a label carried by everyone who believes in and practises fairness, justice and value first.","zh":"OPC 也將走上同樣的路：從字面縮寫，成為每一位信仰並踐行公平公正、價值優先的朋友的新標籤。"}},{"type":"quote","text":{"en":"Use AI well, and be free at last.","zh":"善用 AI，終獲自由。"}}],"num":"07","title":{"en":"OPC: a new label","zh":"OPC：一個新標籤"}},{"id":"next","blocks":[{"type":"p","text":{"en":"The User Centered Era is a design under research, not a finished product. Three questions decide whether it proceeds: whether a rebate and a lasting share change how people dine and travel; whether merchants accept the channel rates; and whether counsel in Hong Kong and the mainland confirm the structure.","zh":"「用戶中心時代」是一項研究中的設計，而非成品。三個問題決定其能否推進：回饋與持久份額是否改變人們用餐與出行的行為；商戶是否接受渠道費率；以及香港與內地的法律顧問是否確認其架構。"}},{"type":"timeline","items":[{"date":{"en":"December 2026","zh":"2026年12月"},"text":{"en":"Legal opinions and merchant interviews","zh":"法律意見與商戶訪談"}},{"date":{"en":"February 2027","zh":"2027年2月"},"text":{"en":"Demand test and first help-network cases reviewed","zh":"需求測試及首批幫助網絡個案檢視"}},{"date":{"en":"April 2027","zh":"2027年4月"},"text":{"en":"Alliance pilot with 30 to 50 merchants reviewed","zh":"30至50家商戶聯盟試點檢視"}}]},{"type":"p","text":{"en":"TABLE AI invites experts, merchants and facilitators who share this view to join the first cohort. Contact hi@tableai.ai.","zh":"TABLE AI 誠邀認同此理念的專家、商戶與協作者加入首批計劃。聯絡：hi@tableai.ai"}},{"type":"quote","text":{"en":"We believe the agent era should return value to the people who create it.","zh":"我們相信，智能體時代應當把價值還給創造價值的人。"}}],"num":"08","title":{"en":"What happens next","zh":"下一步"}},{"id":"ending","blocks":[{"type":"ending","line":{"en":"Either on the table, or on the menu.","zh":"不在桌上，便在菜單上。"},"formula":[{"en":"∀x : ¬Table(x) → Menu(x)","zh":"∀x：¬桌上(x) → 菜單上(x)"},{"en":"≡  Table(x) ∨ Menu(x)","zh":"≡  桌上(x) ∨ 菜單上(x)"}],"caption":{"en":"In every economy, a participant either takes part in dividing value or is divided. The User Centered Era gives every participant a seat at the table.","zh":"在任何經濟體中，參與者要麼參與分配價值，要麼被分配。用戶中心時代讓每一位參與者都在桌上擁有一席之地。"}}],"kind":"ending","tone":"dark","tocLabel":{"en":"Either on the table, or on the menu","zh":"不在桌上，便在菜單上"}},{"id":"glossary","blocks":[{"type":"glossary"}],"title":{"en":"Glossary","zh":"詞彙表"}},{"id":"sources","blocks":[{"type":"sources","items":[{"label":{"en":"National Bureau of Statistics, 2025 catering revenue, via Beijing Business Today","zh":"國家統計局 2025年餐飲收入，北京商報"},"url":"finance.eastmoney.com/a/202601193623640618.html"},{"label":{"en":"Huxiu, hotel commission rates and Trip.com 2025 figures","zh":"虎嗅，酒店佣金率及攜程2025年數據"},"url":"huxiu.com/article/4878830.html"},{"label":{"en":"Caijing via Sina, AI-assistant hotel fee and OTA market share","zh":"《財經》（新浪轉載），AI 助手酒店收費及在線旅遊市場份額"},"url":"finance.sina.com.cn/tech/roll/2026-08-11/doc-inimyhkh5719843.shtml"},{"label":{"en":"United Airlines Holdings, Form 8-K, June 2020","zh":"聯合航空控股，Form 8-K，2020年6月"},"url":"sec.gov/Archives/edgar/data/319687"},{"label":{"en":"McKinsey forecast via Digital Commerce 360","zh":"麥肯錫預測，Digital Commerce 360 轉載"},"url":"digitalcommerce360.com/2025/10/20/mckinsey-forecast-5-trillion-agentic-commerce-sales-2030"}]},{"type":"note","text":{"en":"This manifesto describes a design under research. It is not an offer of securities, deposits or other financial products. Figures marked illustrative or proposed are working assumptions; market figures are from the sources listed.","zh":"本宣言描述一項研究中的設計，並不構成任何證券、存款或其他金融產品的要約。標示為「示意」或「擬議」的數字為工作假設；市場數據出處見所列來源。"}}],"title":{"en":"Sources","zh":"資料來源"}}]};

            const ctx = out.getContext("2d");
            ctx.fillStyle = theme().t.stitchBg;
            ctx.fillRect(0, 0, out.width, out.height);
            let y = m;
            for (const c of parts) {
                ctx.drawImage(c, m, y);
                y += c.height + g;
            }
            await deliver(`${baseName()}-stitched.png`, await toBlob(out), out);
        }
        else {
            const [parts] = await Promise.all([sectionShots(EXPORT_SCALE, numbers), loadLib("zip")]);
            const zip = new JSZip();
            for (let i = 0; i < parts.length; i++)
                zip.file(`${baseName()}-${String(i + 1).padStart(2, "0")}.png`, await toBlob(parts[i]));
            await deliver(`${baseName()}-sections.zip`, state.downloads ? await zip.generateAsync({ type: "blob" }) : null, parts[0]);
        }
    }
    catch (e) {
        toast(`${ui("failed")}: ${e?.message || e}`, 5000);
    }
    finally {
        btns.forEach(b => (b.disabled = false));
    }
}
$$("[data-exp]").forEach(b => (b.onclick = () => runExport(b.dataset.exp)));
/* ============================== Library (live) ============================== */
function renderLibrary() {
    const rows = state.library, cur = state.article.id;
    const head = rows.some(r => r.id === BUILTIN.id) ? [] : [{ id: BUILTIN.id, title: BUILTIN.title, builtin: true }];
    const items = [...head, ...rows];
    $("#lib").innerHTML = items.map(r => `<li><button type="button" data-id="${esc(r.id)}" aria-current="${r.id === cur}">${T(r.title) || esc(r.id)}`
        + `<small>${esc(r.builtin ? ui("builtin") : r.status || "")}${r.date ? " " + esc(r.date) : ""}</small></button></li>`).join("");
    $("#libNote").textContent = state.libStatus === "none" ? ui("libNone") : state.libStatus === "ready" && !rows.length ? ui("libEmpty") : "";
}
function openRecord(rec) {
    state.article = rec ? mustBeValid(JSON.parse(rec.json)) : BUILTIN;
    if (rec)
        state.stamp[rec.id] = rec.updatedAt;
    state.fromDraft = false;
    ls.del(LS.draft);
}
$("#lib").onclick = (e) => {
    const b = e.target.closest("button[data-id]");
    if (!b)
        return;
    try {
        openRecord(state.library.find(r => r.id === b.dataset.id));
        openSheet(false);
        scrollTo(0, 0);
        render();
        if (ed.open)
            fillEditor();
    }
    catch (err) {
        toast(err.message, 5000);
    }
};
function onLibrary(records) {
    state.library = records;
    const rec = records.find(r => r.id === state.article.id);
    if (rec && rec.updatedAt !== state.stamp[rec.id]) {
        const first = state.stamp[rec.id] === undefined;
        if (ed.open && ed.dirty)
            toast(ui("remote"), 5000);
        else if (!(first && state.fromDraft)) {
            try {
                openRecord(rec);
                rerender();
                if (ed.open)
                    fillEditor();
                if (!first)
                    toast(ui("live"));
            }
            catch (err) {
                toast(err.message, 5000);
            }
        }
    }
    renderLibrary();
}
(async () => {
    const claude = window.claude;
    if (!claude?.use) {
        state.libStatus = "none";
        renderLibrary();
        return;
    }
    const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    state.downloads = dl;
    if (user) {
        try {
            state.canEdit = await user.canEdit();
        }
        catch { /* treat as read-only */ }
    }
    if (!db) {
        state.libStatus = "none";
        renderLibrary();
        return;
    }
    state.db = db;
    const timer = setTimeout(() => { if (state.libStatus === "loading") {
        state.libStatus = "none";
        renderLibrary();
    } }, 10000);
    db.collection("articles").onSnapshot((snap) => {
        clearTimeout(timer);
        state.libStatus = "ready";
        onLibrary(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => typeof r.json === "string")
            .sort((x, y) => String(y.date || "").localeCompare(String(x.date || ""))));
    }, () => { clearTimeout(timer); state.libStatus = "none"; renderLibrary(); });
})();
const ed = { open: false, dirty: false, tab: "md-en", source: "md", buf: { "md-en": "", "md-zh": "", json: "" } };
const editor = $("#editor"), src = $("#src"), err = $("#err");
function fillEditor() {
    const a = state.article, rec = state.library.find(r => r.id === a.id && r.json === JSON.stringify(a));
    ed.buf["md-en"] = rec?.md_en || toMarkdown(a, "en");
    ed.buf["md-zh"] = rec?.md_zh || toMarkdown(a, "zh");
    ed.buf.json = JSON.stringify(a, null, 2);
    ed.dirty = false;
    ed.source = "md";
    err.textContent = "";
    showTab(ed.tab, false);
}
function showTab(tab, sync = true) {
    if (sync) {
        ed.buf[ed.tab] = src.value;
        if (tab === "json" && ed.source === "md")
            ed.buf.json = JSON.stringify(state.article, null, 2);
        if (tab !== "json" && ed.source === "json") {
            ed.buf["md-en"] = toMarkdown(state.article, "en");
            ed.buf["md-zh"] = toMarkdown(state.article, "zh");
        }
    }
    ed.tab = tab;
    src.value = ed.buf[tab];
    $$("#fmtSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === tab)));
}
function showEditor(on) {
    editor.classList.toggle("on", on);
    editor.setAttribute("aria-hidden", String(!on));
    document.body.classList.toggle("ed-open", on);
}
function openEditor() { openSheet(false); ed.open = true; document.body.classList.add("editing"); fillEditor(); showEditor(true); src.focus(); }
function closeEditor() {
    ed.open = false;
    ed.dirty = false;
    showEditor(false);
    document.body.classList.remove("editing");
    const rec = state.library.find(r => r.id === state.article.id);
    if (rec && rec.updatedAt !== state.stamp[rec.id]) {
        try {
            openRecord(rec);
            rerender();
        }
        catch { /* keep current */ }
    }
}
/** Parses the editor buffers into an article; returns it, or null with errors shown. */
function compile() {
    ed.buf[ed.tab] = src.value;
    try {
        if (ed.tab === "json") {
            const a = mustBeValid(JSON.parse(ed.buf.json));
            ed.source = "json";
            err.textContent = "";
            return a;
        }
        const { article, issues } = fromMarkdown({ en: ed.buf["md-en"], zh: ed.buf["md-zh"] || undefined });
        const a = mustBeValid(article);
        ed.source = "md";
        err.textContent = issues.slice(0, 4).join("\n");
        return a;
    }
    catch (e) {
        err.textContent = e.message || String(e);
        return null;
    }
}
function applyNow() {
    const a = compile();
    if (a) {
        state.article = a;
        state.fromDraft = true;
        ls.set(LS.draft, JSON.stringify(a));
        rerender();
    }
    return a;
}
let liveTimer;
src.addEventListener("input", () => {
    ed.dirty = true;
    if (!$("#livePrev").checked)
        return;
    clearTimeout(liveTimer);
    liveTimer = window.setTimeout(applyNow, 350);
});
src.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
        e.preventDefault();
        const s = src.selectionStart;
        src.setRangeText("  ", s, src.selectionEnd, "end");
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        $("#publishBtn").click();
    }
});
$("#fmtSeg").onclick = (e) => { const b = e.target.closest("button"); if (b)
    showTab(b.dataset.v); };
$("#editOpen").onclick = openEditor;
$("#edClose").onclick = closeEditor;
$("#edPreview").onclick = () => showEditor(false);
$("#applyBtn").onclick = () => { if (applyNow())
    toast(ui("applied")); };
$("#publishBtn").onclick = async () => {
    const a = applyNow();
    if (!a)
        return;
    if (!(state.db && state.canEdit)) {
        toast(ui("libDenied"), 4000);
        return;
    }
    const md = ed.source === "md" ? { en: ed.buf["md-en"], zh: ed.buf["md-zh"] } : undefined;
    const rec = toRecord(a, md);
    state.stamp[a.id] = rec.updatedAt;
    try {
        await state.db.doc("articles/" + a.id).set(rec);
        ed.dirty = false;
        state.fromDraft = false;
        ls.del(LS.draft);
        toast(ui("libSaved"));
    }
    catch (e) {
        err.textContent = e?.message || String(e);
    }
};
$("#saveFile").onclick = async () => {
    ed.buf[ed.tab] = src.value;
    const id = state.article.id, name = ed.tab === "json" ? `${id}.json` : `${id}.${ed.tab === "md-zh" ? "zh" : "en"}.md`;
    await deliver(name, ed.buf[ed.tab]);
};
$("#loadFile").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async (e) => {
    const input = e.target, f = input.files?.[0];
    if (!f)
        return;
    const text = await f.text();
    input.value = "";
    if (/\.json$/i.test(f.name)) {
        ed.buf.json = text;
        showTab("json", false);
    }
    else {
        const zh = /^locale:\s*zh/m.test(text.split("\n---")[0]);
        ed.buf[zh ? "md-zh" : "md-en"] = text;
        showTab(zh ? "md-zh" : "md-en", false);
    }
    ed.dirty = true;
    applyNow();
};
$("#restore").onclick = () => { ls.del(LS.draft); state.article = BUILTIN; state.fromDraft = false; fillEditor(); rerender(); };
/* ============================== Data, API and MCP ============================== */
$("#dataOpen").onclick = () => {
    openSheet(false);
    const a = state.article;
    $("#dataPre").textContent = [
        `Schema      ${a.schema}`, `Article     ${a.id}  (version ${a.version || 1}, ${a.status || "draft"})`,
        `Locales     ${(a.locales || []).join(", ")}`, `Sections    ${a.sections.length}    Terms ${Object.keys(a.terms || {}).length}`, ``,
        `Authoring   content/${a.id}.en.md + content/${a.id}.zh.md  (Markdown, one file per language)`,
        `Library     articles/{id} = { id, schema, slug, title, status, date, updatedAt, json, md_en, md_zh }`, ``,
        `REST API (Rust content service)`, `  GET  /v1/articles?locale=zh-Hant-HK&status=published`, `  GET  /v1/articles/${a.id}?locale=en`,
        `  GET  /v1/articles/${a.id}/terms`, `  GET  /v1/terms/{termId}?locale=en`, `  PUT  /v1/articles/${a.id}          (editor token)`,
        `  GET  /v1/articles/${a.id}/events  (server-sent events: live updates)`, ``,
        `MCP server (JSON-RPC 2.0 at POST /mcp)`, `  tools/call list_articles | get_article | get_term | search`, ``,
        `Markdown sync: npx md-sync --dir content --api http://localhost:8080 --watch`,
    ].join("\n");
    openModal("#dataModal");
};
$("#copyJson").onclick = async () => {
    try {
        await navigator.clipboard.writeText(JSON.stringify(state.article, null, 2));
        toast(ui("copied"));
    }
    catch {
        $("#dataPre").textContent = JSON.stringify(state.article, null, 2);
    }
};
/* ============================== Start ============================== */
if (state.article.schema !== SCHEMA)
    state.article = BUILTIN;
$("#sheetMark").innerHTML = LOGO.mark;
render();
document.fonts?.ready.then(() => { measure(); onScroll(); });
</script>
